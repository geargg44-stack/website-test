<!DOCTYPE html>
<html lang="ru" data-theme="halloween">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#09060f">
<title>Аккаунт — Mio Client</title><link rel="icon" href="/Icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script><script src="https://cdn.jsdelivr.net/npm/framer-motion@11.2.4/dist/framer-motion.js"></script>
<script>tailwind.config={theme:{extend:{colors:{'mio-card':'rgb(var(--card) / <alpha-value>)','mio-border':'rgba(255,255,255,0.1)','mio-primary':'rgb(var(--p) / <alpha-value>)','mio-secondary':'rgb(var(--s) / <alpha-value>)'}}}};</script>
<style>
:root,[data-theme="halloween"]{--p:255 122 26;--s:157 78 255;--bg:9 6 15;--card:21 15 28}*{box-sizing:border-box}html{min-height:100%;background:rgb(var(--bg))}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,rgba(120,50,170,.14),transparent 55%),rgb(var(--bg));color:#fff;font-family:Inter,sans-serif}button,a,input{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid rgb(var(--p));outline-offset:3px}.btn-premium{background:linear-gradient(100deg,#ff7a1a,#9d4eff);box-shadow:0 0 25px rgba(157,78,255,.18);transition:filter .2s,transform .2s}.btn-premium:hover{filter:brightness(1.12);transform:translateY(-1px)}.field{width:100%;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);border-radius:12px;padding:13px 15px;color:#fff}.field:focus{border-color:rgb(var(--p));outline:none}.card{border:1px solid rgba(255,255,255,.09);background:rgba(21,15,28,.8);backdrop-filter:blur(16px)}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;const {motion}=Motion;
const SUPABASE_URL='https://jllxmrifjflruvllfjst.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_3JkCxHkGAZvmFbY4YeYRaA_0N_-kaZl';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const HOME_URL='/';const ACCOUNT_URL='https://mioddnet.xyz/account.html';const RELEASE_URL='https://github.com/geargg44-stack/Mio-Client-DDNet/releases/latest';
function AccountPage({user,profile,onBack,onSignOut,onDownload}){const premium=!!profile?.is_premium;return <section className="relative min-h-screen flex items-center justify-center px-6 pt-24 pb-16"><motion.div initial={{opacity:0,y:30}} animate={{opacity:1,y:0}} transition={{duration:.6}} className="w-full max-w-xl"><div className="text-center mb-8"><div className="mx-auto mb-5 flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-mio-primary to-mio-secondary text-3xl font-extrabold shadow-[0_0_40px_rgba(157,78,255,.35)]">{(user.email||'?')[0].toUpperCase()}</div><h1 className="text-4xl md:text-5xl font-bold tracking-tight">Добро пожаловать!</h1><p className="text-gray-400 mt-3 break-all">{user.email}</p></div><div className="card rounded-2xl p-6 mb-4"><p className="text-xs uppercase tracking-widest text-gray-500 mb-2">Текущий тариф</p><p className={`text-2xl font-bold ${premium?'text-mio-primary':'text-gray-200'}`}><i className={`fa-solid ${premium?'fa-crown':'fa-seedling'} mr-2`}></i>{premium?'Premium активен':'Free'}</p><p className="text-sm text-gray-400 mt-2">{premium?'Premium привязан к этому аккаунту.':'Premium пока можно получить только через администратора.'}</p></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4"><button onClick={onDownload} className="btn-premium rounded-xl px-5 py-4 font-semibold text-white"><i className="fa-solid fa-download mr-2"></i>Скачать клиент</button><a href="https://discord.gg/CVydaKpS8H" target="_blank" rel="noopener noreferrer" className="card rounded-xl px-5 py-4 text-center font-semibold hover:border-white/30 transition-colors"><i className="fa-brands fa-discord mr-2"></i>Discord</a></div><div className="flex items-center justify-between text-sm gap-4"><button onClick={onBack} className="text-gray-400 hover:text-white"><i className="fa-solid fa-arrow-left mr-2"></i>На главную</button><button onClick={onSignOut} className="text-gray-400 hover:text-mio-primary">Выйти <i className="fa-solid fa-right-from-bracket ml-1"></i></button></div></motion.div></section>}
function AuthPage(){const [user,setUser]=useState(null),[profile,setProfile]=useState(null),[mode,setMode]=useState(new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login'),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[message,setMessage]=useState(''),[busy,setBusy]=useState(false);
const loadProfile=async(id)=>{const {data,error}=await supabaseClient.from('profiles').select('is_premium').eq('id',id).maybeSingle();if(error){console.error(error);setProfile({is_premium:false});return}setProfile(data||{is_premium:false})};
useEffect(()=>{let alive=true;supabaseClient.auth.getSession().then(({data})=>{if(!alive)return;const u=data?.session?.user||null;setUser(u);if(u)loadProfile(u.id)});const {data:{subscription}}=supabaseClient.auth.onAuthStateChange((event,session)=>{const u=session?.user||null;setUser(u);if(event==='PASSWORD_RECOVERY')setMode('update');if(u)setTimeout(()=>loadProfile(u.id),0);else setProfile(null)});return()=>{alive=false;subscription.unsubscribe()}},[]);
const submit=async(e)=>{e.preventDefault();setBusy(true);setMessage('');try{let result;if(mode==='signup'){result=await supabaseClient.auth.signUp({email:email.trim(),password,options:{emailRedirectTo:ACCOUNT_URL}});if(result.error)throw result.error;setMessage(result.data?.session?'Аккаунт создан, вы вошли.':'Письмо подтверждения отправлено. Открой его и нажми ссылку для подтверждения.');if(result.data?.session){setUser(result.data.user);await loadProfile(result.data.user.id)}}else if(mode==='forgot'){result=await supabaseClient.auth.resetPasswordForEmail(email.trim(),{redirectTo:ACCOUNT_URL});if(result.error)throw result.error;setMessage('Если адрес зарегистрирован, на него придёт письмо для сброса пароля.')}else if(mode==='update'){result=await supabaseClient.auth.updateUser({password});if(result.error)throw result.error;setPassword('');setMode('login');setMessage('Пароль изменён. Теперь можно войти с новым паролем.')}else{result=await supabaseClient.auth.signInWithPassword({email:email.trim(),password});if(result.error)throw result.error;setUser(result.data.user);await loadProfile(result.data.user.id)}}catch(err){setMessage(err?.message||'Не удалось выполнить запрос. Попробуй ещё раз.')}finally{setBusy(false)}};
const signOut=async()=>{const {error}=await supabaseClient.auth.signOut();if(error){setMessage(error.message);return}setUser(null);setProfile(null);setPassword('');setMessage('Вы вышли из аккаунта.');setMode('login')};
if(user&&mode!=='update')return <AccountPage user={user} profile={profile} onBack={()=>location.href=HOME_URL} onSignOut={signOut} onDownload={()=>location.href=RELEASE_URL}/>;
return <section className="min-h-screen flex items-center justify-center px-5 py-12"><motion.div initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} className="card w-full max-w-md rounded-3xl p-7 md:p-9 shadow-2xl"><a href="/" className="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-white mb-8"><i className="fa-solid fa-arrow-left"></i> На главную</a><div className="text-center mb-7"><div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl border border-mio-primary/30 bg-mio-primary/10 text-mio-primary text-2xl"><i className={`fa-solid ${mode==='signup'?'fa-user-plus':'fa-user-lock'}`}></i></div><h1 className="text-3xl font-extrabold tracking-tight">{mode==='signup'?'Создать аккаунт':mode==='forgot'?'Сброс пароля':mode==='update'?'Новый пароль':'Вход в Mio Client'}</h1><p className="text-sm text-gray-400 mt-2">Аккаунт Mio Client</p></div><form onSubmit={submit} className="space-y-4"><label className="block"><span className="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-400">Email</span><input className="field" type="email" required autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></label>{mode!=='forgot'&&<label className="block"><span className="mb-2 block text-xs font-semibold uppercase tracking-wider text-gray-400">Пароль</span><input className="field" type="password" required minLength={mode==='signup'||mode==='update'?8:1} autoComplete={mode==='signup'||mode==='update'?'new-password':'current-password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder={mode==='signup'||mode==='update'?'Минимум 8 символов':'Твой пароль'}/></label>}<button type="submit" disabled={busy} className="btn-premium w-full rounded-xl px-5 py-3 font-semibold disabled:opacity-60">{busy?'Подожди…':mode==='signup'?'Зарегистрироваться':mode==='forgot'?'Отправить письмо':mode==='update'?'Сохранить новый пароль':'Войти'}</button></form><div className="mt-5 flex flex-wrap justify-center gap-x-4 gap-y-3 text-xs text-gray-400">{mode==='login'&&<><button onClick={()=>{setMode('signup');setMessage('')}} className="hover:text-white">Создать аккаунт</button><button onClick={()=>{setMode('forgot');setMessage('')}} className="hover:text-white">Забыл пароль</button></>}{mode!=='login'&&mode!=='update'&&<button onClick={()=>{setMode('login');setMessage('')}} className="hover:text-white">Уже есть аккаунт? Войти</button>}{mode==='update'&&<button onClick={()=>{setMode('login');setMessage('')}} className="hover:text-white">Вернуться ко входу</button>}</div>{message&&<p role="status" className="mt-5 rounded-xl border border-mio-primary/20 bg-mio-primary/10 px-4 py-3 text-sm leading-relaxed text-gray-200">{message}</p>}<p className="mt-6 text-center text-[11px] leading-relaxed text-gray-500">Не используй пароль от других сервисов. Статус Premium управляется защищённой базой данных.</p></motion.div></section>}
ReactDOM.createRoot(document.getElementById('root')).render(<AuthPage/>);
</script></body></html>
